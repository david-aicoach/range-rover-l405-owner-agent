name: Validate and Package Skill

on:
  push:
    branches: [main]
    paths:
      - 'range-rover-l405-owner-agent/**'
      - '.github/workflows/package-skill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate knowledge catalogue
        run: python3 range-rover-l405-owner-agent/scripts/validate_catalog.py

      - name: Build portable skill ZIP
        run: |
          rm -rf dist
          mkdir -p dist
          zip -qr dist/skill.zip range-rover-l405-owner-agent -x '*.DS_Store'
          unzip -t dist/skill.zip

      - name: Refresh packaged artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/skill.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: refresh portable skill'
          git push
